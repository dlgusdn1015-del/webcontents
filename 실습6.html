<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>animation</title>
        <style>
            @keyframes bob {
                from {rotate: 0deg;}
                to {rotate: 360deg;}
            }
            img {
                animation-name: bob;
                animation-duration: 1s;
                animation-iteration-count: infinite;
            }
        </style>
    </head>
    <body>
        <h2>어지러워요</h3>
        <hr>
        <div id="rotate">
            <img id="sponge" src="media/sponge.png" width="300" height="400" alt="스폰지밥">
        </div>
    </body>
</html>
