<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>설문지</title>
    </head>
    <body>
        <h3>설문지</h3>

        소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.
        <hr>
        <form>
            <p>학년
                <input type="radio" name="grade" value="1" checked> 1학년
                <input type="radio" name="grade" value="2"> 2학년
                <input type="radio" name="grade" value="3"> 3학년
            </p>
            <p>성별
            <input type="radio" name="gender" value="1"> 남
            <input type="radio" name="gender" value="2"> 여
            </p>
            <p>관심 분야
                <select name="favorite">
                    <option value="1">인공지능</option>
                    <option value="2">프로그래밍</option>
                </select>
            </p>
            <p>진로
                <input type="checkbox" name="job" value="1" checked> 개발
                <input type="checkbox" name="job" value="2"> 기획
                <input type="checkbox" name="job" value="3"> 영업
                <input type="checkbox" name="job" value="4"> 창업
            </p>

            <p>남기고 싶은 말
                <textarea rows="5" cols="50" placeholder="글을 남겨주세요"></textarea>
            </p>

            <p>Copyright 2026 by MYONGJI COLLEGE</p>
        </form>
    </body>
</html>
