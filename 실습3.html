<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>색 테이블 만들기</title>
        <style>
                #bro { background-color: brown; width:100px; height: 50px; }
                #dee { background-color: deepskyblue; width:100px; height: 50px; }
                #blu { background-color: blueviolet; width:100px; height: 50px; }
                #gol { background-color: gold; width:100px; height: 50px; }
                #dar { background-color: darkorange; width:100px; height: 50px; }
                #oli { background-color: olivedrab; width:100px; height: 50px; }
                

        </style>
    </head>
    <body>
        <h3>색 이름과 코드</h3>
        <hr>
        <table border="1">
            <thead>
                <tr><th>이름</th><th>코드</th><th>색</th><th>이름</th><th>코드</th><th>색</th></tr>
                <tr><td>Brown</td><td>#A52A2A</td><td><div id="bro"></div></td>
                    <td>DeepSkyBlue</td><td>#00BFFF</td><td><div id="dee"> </div></td></tr>
                <tr><td>Blueviolet</td><td>#8A2BE2</td><td><div id="blu"></div></td>
                    <td>Gold</td><td>#FFD700</td><td><div id="gol"></div></td></tr>
                <tr><td>DarkOrange</td><td>#FF8C00</td><td><div id="dar"></div></td>
                    <td>OliveDrab</td><td>#6B8E23</td><td><div id="oli"></div></td></tr>

                    
            </thead>
        </table>

    </body>
</html>
