<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>:hover 활용</title>
        <style>
            #back {
                width : 100px;
                height : 100px;
                background-image : url("media/back.jpg");
                background-size : 100px 100px;
            }
            #back:hover {
                background-image : url("media/front.png");
            }
        </style>
    </head>
    <body>
        <h3>:hover 활용</h3>
        <hr>
        <table>
            <tr><td>마우스를 올리면 카드의 앞면이 보인다.</td>
                <td><div id="back"></div></image></td></tr>

        </table>

    </body>
</html>
